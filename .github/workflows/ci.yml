name: iOS Unit Test CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  unit-test:
    name: Run Unit Tests
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set Xcode version
        run: sudo /usr/bin/xcode-select -s /Applications/Xcode.app

      - name: Clean Derived Data
        run: rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Run Unit Tests
        run: |
          xcodebuild \
            -project SimpleAIChat.xcodeproj \
            -scheme SimpleAIChat \
            -destination 'platform=iOS Simulator,name=iPhone 14' \
            -enableCodeCoverage YES \
            clean test | tee xcodebuild.log | xcpretty && exit ${PIPESTATUS[0]}
